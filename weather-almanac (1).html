<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SkyCheck — quick weather lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --ink:#122437;
    --slate:#3d5a73;
    --slate-soft:#6c8499;
    --paper:#e9eff2;
    --line:#c3d0d8;
    --amber:#b8863b;
    --amber-soft:#e4cfa4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    transition:background 0.6s ease;
  }
  .sky{
    position:fixed; inset:0; z-index:-1;
    transition: background 0.8s ease;
  }
  .card{
    width:100%;
    max-width:460px;
    background:#fff;
    border:1px solid var(--line);
    box-shadow:0 1px 0 var(--line), 0 24px 48px -24px rgba(18,36,55,0.25);
  }
  .masthead{
    padding:28px 32px 20px;
    border-bottom:1px solid var(--line);
  }
  .masthead h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:28px;
    letter-spacing:0.2px;
    margin:0 0 2px;
  }
  .masthead p{
    margin:0;
    font-size:13px;
    color:var(--slate-soft);
  }
  form{
    display:flex;
    border-bottom:1px solid var(--line);
  }
  input{
    flex:1;
    border:none;
    outline:none;
    padding:16px 32px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    color:var(--ink);
    background:transparent;
  }
  input::placeholder{color:var(--slate-soft);}
  button{
    border:none;
    background:var(--ink);
    color:#fff;
    padding:0 22px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    letter-spacing:0.3px;
    cursor:pointer;
  }
  button:hover{background:var(--slate);}
  .body-area{ padding:28px 32px 32px; min-height:220px; }
  .reading{
    display:flex;
    align-items:baseline;
    gap:16px;
    margin-bottom:4px;
  }
  .temp{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:64px;
    line-height:1;
  }
  .cond{
    font-size:15px;
    color:var(--slate);
    padding-bottom:6px;
  }
  .place{
    font-size:13px;
    color:var(--slate-soft);
    margin:2px 0 22px;
  }
  .ledger{
    border-top:1px solid var(--line);
  }
  .row{
    display:flex;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .row .label{ color:var(--slate-soft); }
  .row .value{ color:var(--ink); font-variant-numeric: tabular-nums; }
  .empty, .error{
    color:var(--slate-soft);
    font-size:14px;
    padding:20px 0;
  }
  .error{ color:#a5432b; }
  .loading{ color:var(--slate-soft); font-size:14px; padding:20px 0; }
  .footer-note{
    padding:14px 32px;
    border-top:1px solid var(--line);
    font-size:11.5px;
    color:var(--slate-soft);
  }
  @media (max-width:480px){
    .masthead, .body-area, .footer-note{ padding-left:20px; padding-right:20px; }
    input{ padding-left:20px; padding-right:20px; }
    .temp{ font-size:52px; }
  }
</style>
</head>
<body>
<div id="sky" class="sky"></div>
<div id="root"></div>

<script>
// --- Weather code -> description, and a background gradient per condition/time of day ---
// WMO Weather interpretation codes (used by Open-Meteo)
const WEATHER_CODES = {
  0:  { label: "Clear sky" },
  1:  { label: "Mostly clear" },
  2:  { label: "Partly cloudy" },
  3:  { label: "Overcast" },
  45: { label: "Fog" },
  48: { label: "Depositing rime fog" },
  51: { label: "Light drizzle" },
  53: { label: "Drizzle" },
  55: { label: "Dense drizzle" },
  56: { label: "Freezing drizzle" },
  57: { label: "Dense freezing drizzle" },
  61: { label: "Slight rain" },
  63: { label: "Rain" },
  65: { label: "Heavy rain" },
  66: { label: "Freezing rain" },
  67: { label: "Heavy freezing rain" },
  71: { label: "Slight snow" },
  73: { label: "Snow" },
  75: { label: "Heavy snow" },
  77: { label: "Snow grains" },
  80: { label: "Slight rain showers" },
  81: { label: "Rain showers" },
  82: { label: "Violent rain showers" },
  85: { label: "Slight snow showers" },
  86: { label: "Heavy snow showers" },
  95: { label: "Thunderstorm" },
  96: { label: "Thunderstorm with hail" },
  99: { label: "Thunderstorm with heavy hail" },
};

function skyGradient(code, isDay) {
  const day = isDay === 1;
  if (code === 0 || code === 1) {
    return day
      ? "linear-gradient(180deg,#bcd9ec 0%,#e9eff2 55%)"
      : "linear-gradient(180deg,#0f2138 0%,#3d5a73 100%)";
  }
  if (code === 2 || code === 3) {
    return day
      ? "linear-gradient(180deg,#cbd6dd 0%,#e9eff2 60%)"
      : "linear-gradient(180deg,#1c2c3b 0%,#3d5a73 100%)";
  }
  if ([45,48].includes(code)) return "linear-gradient(180deg,#d6dde1 0%,#e9eff2 60%)";
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) {
    return "linear-gradient(180deg,#5f7f8f 0%,#c9d5db 65%,#e9eff2 100%)";
  }
  if ([71,73,75,77,85,86].includes(code)) return "linear-gradient(180deg,#d9e4ea 0%,#e9eff2 60%)";
  if ([95,96,99].includes(code)) return "linear-gradient(180deg,#2c3947 0%,#5f7f8f 60%)";
  return "#e9eff2";
}

const { useState, useCallback } = React;

function App() {
  const [query, setQuery] = useState("");
  const [status, setStatus] = useState("idle"); // idle | loading | error | ready
  const [errorMsg, setErrorMsg] = useState("");
  const [data, setData] = useState(null);

  const search = useCallback(async (cityName) => {
    if (!cityName || !cityName.trim()) return;
    setStatus("loading");
    setErrorMsg("");
    try {
      const geoRes = await fetch(
        "https://geocoding-api.open-meteo.com/v1/search?name=" +
          encodeURIComponent(cityName.trim()) +
          "&count=1&language=en&format=json"
      );
      const geoJson = await geoRes.json();
      if (!geoJson.results || geoJson.results.length === 0) {
        setStatus("error");
        setErrorMsg("No place found by that name. Try a nearby larger city.");
        return;
      }
      const place = geoJson.results[0];

      const wxRes = await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=" +
          place.latitude +
          "&longitude=" +
          place.longitude +
          "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&timezone=auto"
      );
      const wxJson = await wxRes.json();
      if (!wxJson.current) {
        setStatus("error");
        setErrorMsg("The forecast service didn't return a reading. Try again.");
        return;
      }

      const bg = skyGradient(wxJson.current.weather_code, wxJson.current.is_day);
      document.getElementById("sky").style.background = bg;

      setData({
        place: [place.name, place.admin1, place.country].filter(Boolean).join(", "),
        current: wxJson.current,
      });
      setStatus("ready");
    } catch (err) {
      setStatus("error");
      setErrorMsg("Couldn't reach the weather service. Check your connection and try again.");
    }
  }, []);

  const onSubmit = (e) => {
    e.preventDefault();
    search(query);
  };

  const cond = data ? (WEATHER_CODES[data.current.weather_code]?.label || "Unknown conditions") : null;

  return React.createElement(
    "div",
    { className: "card" },
    React.createElement(
      "div",
      { className: "masthead" },
      React.createElement("h1", null, "SkyCheck"),
      React.createElement("p", null, "Type a city, get the sky.")
    ),
    React.createElement(
      "form",
      { onSubmit: onSubmit },
      React.createElement("input", {
        value: query,
        onChange: (e) => setQuery(e.target.value),
        placeholder: "Enter a city — Baku, Lisbon, Osaka…",
        "aria-label": "City name",
      }),
      React.createElement("button", { type: "submit" }, "READ SKY")
    ),
    React.createElement(
      "div",
      { className: "body-area" },
      status === "idle" &&
        React.createElement(
          "p",
          { className: "empty" },
          "Enter a city above and press Read Sky to take a reading."
        ),
      status === "loading" &&
        React.createElement("p", { className: "loading" }, "Taking the reading…"),
      status === "error" &&
        React.createElement("p", { className: "error" }, errorMsg),
      status === "ready" &&
        data &&
        React.createElement(
          React.Fragment,
          null,
          React.createElement(
            "div",
            { className: "reading" },
            React.createElement(
              "span",
              { className: "temp" },
              Math.round(data.current.temperature_2m) + "°"
            ),
            React.createElement("span", { className: "cond" }, cond)
          ),
          React.createElement("p", { className: "place" }, data.place),
          React.createElement(
            "div",
            { className: "ledger" },
            React.createElement(
              "div",
              { className: "row" },
              React.createElement("span", { className: "label" }, "Feels like"),
              React.createElement(
                "span",
                { className: "value" },
                Math.round(data.current.apparent_temperature) + "°"
              )
            ),
            React.createElement(
              "div",
              { className: "row" },
              React.createElement("span", { className: "label" }, "Humidity"),
              React.createElement(
                "span",
                { className: "value" },
                data.current.relative_humidity_2m + "%"
              )
            ),
            React.createElement(
              "div",
              { className: "row" },
              React.createElement("span", { className: "label" }, "Wind"),
              React.createElement(
                "span",
                { className: "value" },
                Math.round(data.current.wind_speed_10m) + " km/h"
              )
            )
          )
        )
    ),
    React.createElement(
      "div",
      { className: "footer-note" },
      "Readings from Open-Meteo — no key, no cost, refreshed on each search."
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
